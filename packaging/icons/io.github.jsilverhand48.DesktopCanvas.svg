<?xml version="1.0" encoding="UTF-8"?>
<!--
Application icon for desktop-canvas. Scalable source of truth; installed to
share/icons/hicolor/scalable/apps/ under the app id. The name must track
CANVAS_APP_ID in the top level CMakeLists.txt and the Icon= key in
packaging/desktop/.

Composition is deliberately bold (few large shapes, high contrast) so it
stays readable when rendered down to 24px in a panel or menu.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="dc-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241a4d"/>
      <stop offset="0.55" stop-color="#5b2d8e"/>
      <stop offset="1" stop-color="#a13d8f"/>
    </linearGradient>
    <linearGradient id="dc-wave-back" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7ab8"/>
      <stop offset="1" stop-color="#ffb26b"/>
    </linearGradient>
    <linearGradient id="dc-frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <clipPath id="dc-screen">
      <rect x="10" y="10" width="108" height="108" rx="22"/>
    </clipPath>
  </defs>

  <g clip-path="url(#dc-screen)">
    <rect x="10" y="10" width="108" height="108" fill="url(#dc-sky)"/>

    <!-- moon, offset left so it does not collide with the wave crest -->
    <circle cx="46" cy="44" r="14" fill="#ffe9b0"/>
    <circle cx="39" cy="39" r="12" fill="#3a2470" opacity="0.9"/>

    <!-- stars -->
    <circle cx="88" cy="32" r="2.6" fill="#ffffff" opacity="0.9"/>
    <circle cx="100" cy="52" r="1.8" fill="#ffffff" opacity="0.7"/>
    <circle cx="76" cy="22" r="1.6" fill="#ffffff" opacity="0.6"/>

    <!-- animated scene suggested by two offset wave bands -->
    <path d="M10 86 C 30 68, 50 104, 70 86 S 110 68, 128 86 L128 118 L10 118 Z"
          fill="url(#dc-wave-back)" opacity="0.55"/>
    <path d="M10 98 C 32 80, 52 114, 74 96 S 112 82, 128 98 L128 118 L10 118 Z"
          fill="#ff5fa2"/>
  </g>

  <rect x="10" y="10" width="108" height="108" rx="22"
        fill="none" stroke="url(#dc-frame)" stroke-width="3"/>
</svg>
